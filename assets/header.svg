<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" fill="none">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="headerBg" x1="0" y1="0" x2="880" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#080b11" />
    </linearGradient>

    <!-- Border Gradient with Emerald/Cyan Hint -->
    <linearGradient id="headerBorder" x1="0" y1="0" x2="880" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#30363d" />
      <stop offset="75%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Ambient Subtle Glows -->
    <radialGradient id="ambientGlow" cx="20%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#238636" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanAmbient" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #ffffff; font-size: 38px; }
    .tag { font-size: 11px; fill: #7d8590; letter-spacing: 1.5px; font-weight: 600; }
    .subtitle { font-size: 18px; fill: #c9d1d9; font-weight: 400; }
    .subtext { font-size: 11px; fill: #7d8590; letter-spacing: 1px; font-weight: 600; }
    .path { font-size: 12px; fill: #484f58; }
    .term-text { font-size: 12.5px; fill: #e6edf3; }
    .comment { font-size: 11px; fill: #484f58; }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor { animation: blink 1s infinite; }
  </style>

  <!-- Main Card -->
  <rect x="1" y="1" width="878" height="248" rx="14" fill="url(#headerBg)" stroke="url(#headerBorder)" stroke-width="1.3" />
  <rect x="1" y="1" width="878" height="248" rx="14" fill="url(#ambientGlow)" />
  <rect x="1" y="1" width="878" height="248" rx="14" fill="url(#cyanAmbient)" />

  <!-- LEFT CONTENT -->
  <g transform="translate(48, 42)">
    <!-- Workspace Tag -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="5" r="4.5" fill="#2ea043" filter="url(#glowGreen)" />
      <circle cx="5" cy="5" r="2.5" fill="#3fb950" />
      <text x="22" y="9" class="mono tag">MADHAVAN20906 // AUTONOMOUS LAB &amp; WORKSPACE</text>
    </g>

    <!-- Name Heading -->
    <g transform="translate(0, 52)">
      <text x="0" y="0" class="sans title">Hi, I'm Madhavan<tspan fill="#3fb950">.</tspan></text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 84)">
      <text x="0" y="0" class="sans subtitle">Architecting Intelligent Systems &amp; Agentic Software</text>
    </g>

    <!-- Progress Line & Motto -->
    <g transform="translate(0, 118)">
      <rect x="0" y="4" width="45" height="3" rx="1.5" fill="#3fb950" />
      <text x="60" y="9" class="mono subtext">SMALL COMMITS. EXPONENTIAL PROGRESS.</text>
    </g>

    <!-- Terminal Path -->
    <g transform="translate(0, 160)">
      <text x="0" y="0" class="mono path">~/madhavan20906/lab <tspan fill="#3fb950">● active</tspan></text>
    </g>
  </g>

  <!-- RIGHT TERMINAL WORKSTATION -->
  <g transform="translate(480, 32)">
    <!-- Subtle Circuit Traces -->
    <path d="M -35 85 H -10 V 42 H 15" stroke="#238636" stroke-width="1" stroke-dasharray="3 3" opacity="0.8" />
    <circle cx="-10" cy="42" r="2.5" fill="#3fb950" />

    <!-- Terminal Window -->
    <g transform="translate(40, 10)">
      <!-- Screen Outer Shell -->
      <rect x="0" y="0" width="290" height="162" rx="8" fill="#121720" stroke="#30363d" stroke-width="1.2" />
      
      <!-- Top Title Bar -->
      <path d="M 0 0 H 290 V 26 H 0 Z" fill="#090d14" />
      <circle cx="14" cy="13" r="3" fill="#ff5f56" />
      <circle cx="24" cy="13" r="3" fill="#ffbd2e" />
      <circle cx="34" cy="13" r="3" fill="#27c93f" />
      <text x="180" y="17" class="mono comment">~/mesh/agent-core</text>
      
      <!-- Terminal Output lines -->
      <g transform="translate(16, 52)">
        <text x="0" y="0" class="mono term-text"><tspan fill="#3fb950">&gt;</tspan> python -m agent.mesh <tspan fill="#a5d6ff">--serve</tspan></text>
        <rect x="238" y="-12" width="7" height="14" fill="#3fb950" class="cursor" />

        <text x="0" y="24" class="mono" font-size="11.5" fill="#38bdf8">● SentinelMesh [ACTIVE]</text>
        <text x="0" y="44" class="mono" font-size="11.5" fill="#3fb950">✓ On-Device Engine: Ready</text>
      </g>

      <!-- Accent status line in window -->
      <line x1="16" y1="134" x2="180" y2="134" stroke="#238636" stroke-width="2" stroke-linecap="round" />
      <circle cx="185" cy="134" r="2" fill="#3fb950" />
      
      <!-- Keyboard Base -->
      <path d="M -25 162 L -10 180 H 300 L 315 162 Z" fill="#090d14" stroke="#30363d" stroke-width="1.2" />
      <rect x="105" y="164" width="80" height="4" rx="2" fill="#21262d" />
    </g>

    <!-- Floating Cyberpunk Badges -->
    <!-- </> Code Squircle -->
    <g transform="translate(10, 42)">
      <rect x="0" y="0" width="30" height="30" rx="7" fill="#121720" stroke="#238636" stroke-width="1.2" />
      <text x="5.5" y="20" class="mono" font-size="12" font-weight="700" fill="#3fb950">&lt;/&gt;</text>
    </g>

    <!-- AI Node Pill -->
    <g transform="translate(8, 114)">
      <rect x="0" y="0" width="32" height="32" rx="8" fill="#121720" stroke="#38bdf8" stroke-width="1.2" />
      <text x="6" y="21" class="mono" font-size="12" font-weight="700" fill="#38bdf8">AI</text>
    </g>

    <!-- Checkmark status circle -->
    <g transform="translate(350, 116)">
      <circle cx="15" cy="15" r="15" fill="#121720" stroke="#238636" stroke-width="1.2" />
      <path d="M 10 15 L 14 19 L 21 11" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Subtext -->
    <g transform="translate(170, 204)">
      <text x="0" y="0" class="mono comment">ideas → code → intelligence</text>
    </g>
  </g>
</svg>