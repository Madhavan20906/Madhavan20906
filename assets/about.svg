<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="aboutCardBg" x1="0" y1="0" x2="880" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#080b11" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="aboutBorderGrad" x1="0" y1="0" x2="880" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#30363d" />
      <stop offset="70%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#238636" stop-opacity="0.8" />
    </linearGradient>

    <!-- Canvas Card Gradient -->
    <linearGradient id="canvasGrad" x1="0" y1="0" x2="236" y2="268" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <radialGradient id="aboutGlow" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .tag { font-size: 11px; fill: #7d8590; letter-spacing: 1.5px; font-weight: 600; }
    .heading { font-weight: 700; fill: #ffffff; font-size: 27px; }
    .key { font-size: 13px; fill: #7d8590; }
    .val { font-size: 13.5px; fill: #e6edf3; font-weight: 400; }
    .dot-accent { fill: #38bdf8; font-size: 12px; }
    .green-dot { fill: #3fb950; font-size: 12px; }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="878" height="338" rx="14" fill="url(#aboutCardBg)" stroke="url(#aboutBorderGrad)" stroke-width="1.3" />
  <rect x="1" y="1" width="878" height="338" rx="14" fill="url(#aboutGlow)" />

  <!-- LEFT: BIO & BULLETS -->
  <g transform="translate(48, 38)">
    <!-- Section Tag -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="5" r="3.5" fill="#38bdf8" />
      <text x="20" y="9" class="mono tag">CORE FOCUS // SYSTEMS &amp; INTELLIGENCE</text>
    </g>

    <!-- Role Title -->
    <g transform="translate(0, 44)">
      <text x="0" y="0" class="sans heading">Systems Architect &amp; AI Engineer<tspan fill="#3fb950">.</tspan></text>
    </g>

    <line x1="0" y1="62" x2="520" y2="62" stroke="#21262d" stroke-width="1" />

    <!-- Key-Value Details -->
    <g transform="translate(0, 92)">
      <!-- Row 1: focus -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" class="mono key">focus:</text>
        <text x="110" y="0" class="sans val">Agentic AI <tspan class="dot-accent">•</tspan> Autonomous Governance <tspan class="dot-accent">•</tspan> Multi-Agent SaaS</text>
      </g>

      <!-- Row 2: stack -->
      <g transform="translate(0, 34)">
        <text x="0" y="0" class="mono key">stack:</text>
        <text x="110" y="0" class="sans val">Native Android <tspan class="green-dot">•</tspan> WebMCP Tools <tspan class="green-dot">•</tspan> Distributed Pipelines</text>
      </g>

      <!-- Row 3: flagships -->
      <g transform="translate(0, 68)">
        <text x="0" y="0" class="mono key">flagships:</text>
        <text x="110" y="0" class="sans val">SentinelMesh <tspan class="dot-accent">•</tspan> ProofPilot <tspan class="dot-accent">•</tspan> GrantGuardian</text>
      </g>

      <!-- Row 4: mindset -->
      <g transform="translate(0, 102)">
        <text x="0" y="0" class="mono key">mindset:</text>
        <text x="110" y="0" class="sans val">Understand <tspan fill="#3fb950">→</tspan> Experiment <tspan fill="#3fb950">→</tspan> Build <tspan fill="#3fb950">→</tspan> Iterate <tspan fill="#3fb950">→</tspan> Ship.</text>
      </g>

      <!-- Row 5: fun_fact -->
      <g transform="translate(0, 136)">
        <text x="0" y="0" class="mono key">fun_fact:</text>
        <text x="110" y="0" class="sans val">It compiled on the first try. Now I'm suspicious.</text>
      </g>
    </g>
  </g>

  <!-- 3D Geometric Mesh Wireframe -->
  <g transform="translate(565, 30)">
    <polygon points="25,5 45,18 40,42 15,42 5,18" fill="none" stroke="#0284c7" stroke-width="1.2" />
    <line x1="25" y1="5" x2="25" y2="28" stroke="#38bdf8" stroke-width="1" />
    <line x1="45" y1="18" x2="25" y2="28" stroke="#38bdf8" stroke-width="1" />
    <line x1="40" y1="42" x2="25" y2="28" stroke="#38bdf8" stroke-width="1" />
    <line x1="15" y1="42" x2="25" y2="28" stroke="#38bdf8" stroke-width="1" />
    <line x1="5" y1="18" x2="25" y2="28" stroke="#38bdf8" stroke-width="1" />
    <!-- Glowing Node Dots -->
    <circle cx="25" cy="5" r="2.5" fill="#38bdf8" />
    <circle cx="45" cy="18" r="2.5" fill="#3fb950" />
    <circle cx="40" cy="42" r="2.5" fill="#38bdf8" />
    <circle cx="15" cy="42" r="2.5" fill="#3fb950" />
    <circle cx="5" cy="18" r="2.5" fill="#38bdf8" />
    <circle cx="25" cy="28" r="3" fill="#a78bfa" />
  </g>

  <!-- RIGHT: VIBRANT COZY MODERN TECH ILLUSTRATION CARD -->
  <g transform="translate(605, 36)">
    <!-- Main Card Canvas -->
    <rect x="0" y="0" width="228" height="268" rx="10" fill="url(#canvasGrad)" />

    <!-- Futuristic Floating Panes -->
    <rect x="36" y="20" width="148" height="64" rx="5" fill="#ffffff" />
    <rect x="36" y="20" width="148" height="14" rx="5" fill="#f43f5e" />
    <circle cx="46" cy="27" r="2.5" fill="#ffffff" />
    <circle cx="53" cy="27" r="2.5" fill="#ffffff" />
    <circle cx="60" cy="27" r="2.5" fill="#ffffff" />
    
    <!-- Code / Data Graph in Pane -->
    <path d="M 48 50 Q 64 38, 80 52 T 115 44" stroke="#f43f5e" stroke-width="2" fill="none" />
    <circle cx="122" cy="44" r="5" fill="#fb923c" />
    <rect x="134" y="42" width="40" height="4" rx="2" fill="#e2e8f0" />
    <rect x="134" y="50" width="30" height="4" rx="2" fill="#e2e8f0" />

    <!-- Side Tool Palette -->
    <rect x="164" y="26" width="20" height="74" rx="3" fill="#fb7185" />
    <circle cx="174" cy="38" r="3" fill="#ffffff" />
    <circle cx="174" cy="50" r="3" fill="#ffffff" />
    <circle cx="174" cy="62" r="3" fill="#ffffff" />

    <!-- Architectural Pillar -->
    <rect x="16" y="148" width="22" height="95" fill="#ffffff" />
    <rect x="12" y="142" width="30" height="6" rx="2" fill="#f1f5f9" />
    <rect x="12" y="243" width="30" height="6" rx="2" fill="#f1f5f9" />

    <!-- Hourglass -->
    <path d="M 21 122 L 33 122 L 27 132 L 33 142 L 21 142 L 27 132 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1" />

    <!-- Gateway Arch -->
    <path d="M 166 248 V 166 A 25 25 0 0 1 216 166 V 248 Z" fill="#10b981" />
    <circle cx="191" cy="166" r="6" fill="#fef08a" />
    <circle cx="191" cy="166" r="2" fill="#047857" />

    <!-- Developer Desk & Setup -->
    <rect x="46" y="196" width="98" height="6" rx="2" fill="#0f172a" />
    <rect x="54" y="202" width="6" height="42" fill="#0f172a" />
    <rect x="130" y="202" width="6" height="42" fill="#0f172a" />

    <!-- Laptop -->
    <polygon points="66,196 90,196 94,180 70,180" fill="#f8fafc" />
    <polygon points="63,196 93,196 95,198 61,198" fill="#94a3b8" />

    <!-- Developer Avatar Coding -->
    <circle cx="106" cy="172" r="11" fill="#f43f5e" />
    <circle cx="109" cy="175" r="7" fill="#fed7aa" />
    <path d="M 98 186 C 98 180, 118 180, 120 186 L 122 216 L 96 216 Z" fill="#ef4444" />
    <path d="M 98 216 L 96 244 M 114 216 L 116 244" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />

    <!-- Foliage -->
    <ellipse cx="26" cy="112" rx="10" ry="10" fill="#22c55e" />
    <ellipse cx="156" cy="188" rx="8" ry="14" fill="#34d399" />
    <ellipse cx="164" cy="176" rx="6" ry="10" fill="#059669" />

    <!-- Sparkles -->
    <path d="M 120 105 L 123 111 L 129 114 L 123 117 L 120 123 L 117 117 L 111 114 L 117 111 Z" fill="#f472b6" />
    <circle cx="180" cy="100" r="3" fill="#fef08a" />
  </g>
</svg>